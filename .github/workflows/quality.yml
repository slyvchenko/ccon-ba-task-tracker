name: CCON BA Desk quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Python, JavaScript and release regression checks
        run: python check_project.py
      - name: Validate private cloud Compose manifest without credentials
        run: docker compose --env-file .env.example config --quiet

  coverage-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned developer-only Python branch coverage
        run: python -m pip install coverage==7.11.0
      - name: Print synthetic regression branch coverage without exporting private data
        run: |
          python -m coverage run --branch --source=. --omit='tests/*,examples/*' -m unittest discover -s tests
          python -m coverage report -m --skip-covered
          python -m coverage json -o coverage-summary.json
          python -c "import json; x=json.load(open('coverage-summary.json')); print('TOTAL_STMTS=',x['totals']['num_statements'],'BRANCHES=',x['totals']['num_branches'],'MISSING_BRANCHES=',x['totals']['missing_branches'])"
      # No CI artifact upload of .coverage, source files, runtime inbox or user payloads.

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned Chromium test-only dependency
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Real Chromium DOM integration with synthetic-only BA cases
        env:
          CCON_BROWSER_ARTIFACTS: browser-artifacts
        run: python browser_e2e.py
      - name: Preserve synthetic-only browser timings and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-synthetic-results
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 3

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install IANA timezone data for Windows cloud-scheduler unit tests
        run: python -m pip install tzdata==2025.3
      - name: Native Windows Python and CMD regression checks (synthetic only)
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python release_readiness.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
