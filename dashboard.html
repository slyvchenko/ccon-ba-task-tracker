<!doctype html>
<html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCON BA Desk</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#203047;background:#eef2f6}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd5e1;border-radius:8px;padding:10px 15px;background:white;color:#203047}button:hover{background:#e8eff8}button:disabled{opacity:.5;cursor:wait}.primary{background:#215bbb;color:white}.primary:hover{background:#184994}header{display:flex;align-items:center;gap:24px;padding:20px 28px;background:#fff;border-bottom:1px solid #d9e1eb}h1{margin:0;font-size:25px}header p{margin:6px 0;color:#68758b;font-size:13px}.tools{margin-left:auto;display:flex;gap:10px}a{color:#215bbb}#message{padding:12px 28px;min-height:44px;background:#e4edf9}#message.error{background:#ffeded;color:#a02929}.layout{display:grid;grid-template-columns:minmax(290px,31%) 1fr;gap:20px;padding:20px 28px;height:calc(100dvh - 138px)}aside,main{background:white;border:1px solid #d9e1eb;border-radius:12px;min-height:0;overflow:auto}.filters{padding:16px;display:grid;gap:10px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;background:white;z-index:1}input,select,textarea{padding:10px;border:1px solid #bdc9da;border-radius:7px;width:100%}.row{display:block;width:100%;text-align:left;border:none;border-radius:0;padding:17px;border-bottom:1px solid #e9edf3}.row.selected{background:#eaf1fc;border-left:4px solid #215bbb}.row strong{display:block;margin:7px 0}.muted{font-size:13px;color:#66758b}.badge{display:inline-block;font-size:12px;background:#eaf0f7;color:#40556f;padding:4px 8px;border-radius:5px;margin:3px 5px 3px 0}.blocking{background:#ffe4e4;color:#a42626}main{padding:24px}h2{margin:8px 0 18px;font-size:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}h3{font-size:14px;color:#536982;margin:20px 0 8px}p.pre{white-space:pre-wrap;line-height:1.55;margin:7px 0;overflow-wrap:anywhere}label{display:block;font-size:14px;font-weight:600;margin:15px 0 8px}textarea{resize:vertical;min-height:115px}#output{min-height:180px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{padding:30px;color:#66758b;line-height:1.7}summary{cursor:pointer;color:#215bbb}details{margin-top:22px}#saved{color:#28734b;font-size:13px;margin:12px 0}.small{font-size:12px} @media(max-width:850px){header{flex-wrap:wrap;padding:16px}.tools{margin-left:0;flex-wrap:wrap}.layout{display:block;height:auto;padding:12px}aside{max-height:340px;margin-bottom:14px}.grid{grid-template-columns:1fr}main{padding:18px}h2{font-size:21px}}
</style>
<header><div><h1>CCON BA Desk</h1><p>Твій наступний крок · Статуси й нотатки зберігаються локально</p></div><div class="tools"><button id="import">Імпортувати snapshot</button><button id="export">Експорт стану</button></div></header>
<div id="message" role="status" aria-live="polite">Завантаження…</div>
<div class="layout"><aside><div class="filters"><input id="search" aria-label="Пошук задач" placeholder="Знайти задачу…"><select id="filter" aria-label="Фільтр задач"><option value="open">Поточні · незавершені</option><option value="all">Усі поточні</option><option value="done">Завершені</option><option value="archive">Відсутні в останньому snapshot</option></select><span id="count" class="muted"></span></div><div id="list"></div></aside><main id="detail"></main></div>
<script>
'use strict';
let tasks=[], selected=null, latest=null, dirty=false, busy=false, signature='';
const drafts={};
const $=id=>document.getElementById(id), statuses=['AUTO','IN PROGRESS','WAITING INPUT','WAITING DEPENDENCY','NEEDS DECISION','DONE'];
const labels={'AUTO':'За оцінкою Rovo','IN PROGRESS':'У роботі','WAITING INPUT':'Очікую відповідь','WAITING DEPENDENCY':'Очікую залежність','NEEDS DECISION':'Потрібне рішення','DONE':'Завершено','ACTIONABLE NOW':'Можна працювати','NO FURTHER BA ACTION':'Без подальших дій BA','NOT ANALYZED':'Ще не проаналізовано'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const effective=t=>t.manualStatus==='AUTO'?(t.aiStatus||'Не визначено'):t.manualStatus;
function message(s,error=false){$('message').textContent=s;$('message').classList.toggle('error',error)}
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'Помилка');return d}
function visible(){const q=$('search').value.toLowerCase(),f=$('filter').value;return tasks.filter(t=>(f==='archive'?!t.active:t.active&&(f==='all'||(f==='done'?effective(t)==='DONE':effective(t)!=='DONE')))&&((t.key+' '+t.summary).toLowerCase().includes(q)))}
function renderList(){const items=visible();$('count').textContent=items.length+' задач';$('list').innerHTML=items.map(t=>`<button class="row ${t.key===selected?'selected':''}" data-key="${esc(t.key)}"><span class="muted">${esc(t.key)} · ${esc(t.priority||'')}</span><strong>${esc(t.summary)}</strong><span class="badge">${esc(labels[effective(t)]||effective(t))}</span>${t.blocking?'<span class="badge blocking">Блокує інших</span>':''}</button>`).join('')||'<div class="empty">Немає задач у цьому списку.</div>';$('list').querySelectorAll('[data-key]').forEach(el=>el.onclick=()=>{if(dirty&&!confirm('Є незбережені зміни. Перейти без збереження?'))return;selected=el.dataset.key;dirty=false;renderList();renderDetail()})}
function safeUrl(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function renderDetail(){const t=tasks.find(t=>t.key===selected);if(!t){$('detail').innerHTML='<div class="empty"><h2>Почни зі snapshot</h2>Збережи файл <b>CCON_BA_Snapshot.json</b> у папку <b>inbox</b> поруч із server.py.<br>Він імпортується автоматично; або натисни «Імпортувати snapshot».<br>Для тесту скопіюй examples/snapshot.json у inbox з потрібною назвою.<br><br>Rovo оновлює свою оцінку. Твої статуси й нотатки зберігаються між днями.</div>';return}
const url=safeUrl(t.url);$('detail').innerHTML=`<span class="muted">${esc(t.key)}${url?` · <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Відкрити Jira ↗</a>`:''}</span><h2>${esc(t.summary)}</h2>${t.blocking?'<span class="badge blocking">Блокує інших</span>':''}<span class="badge">Jira: ${esc(t.jiraStatus||'Не вказано')}</span>${!t.active?'<span class="badge">Відсутня в останньому snapshot · стан збережений</span>':''}<div class="grid"><section><h3>Оцінка Rovo</h3><p class="pre">${esc(labels[t.aiStatus]||t.aiStatus||'Не визначено')}</p><h3>На кого чекаємо</h3><p class="pre">${esc(t.waitingOn||'Не визначено')}</p><h3>Чому така оцінка</h3><p class="pre">${esc(t.statusReason||'Rovo не надав пояснення. Перевір контекст у Jira.')}</p><h3>Наступна дія</h3><p class="pre" id="nextText">${esc(t.nextAction||'Дія не вказана.')}</p><button id="copyNext">Скопіювати цю дію</button></section><section><label for="manual">Мій статус</label><select id="manual">${statuses.map(s=>`<option value="${s}" ${s===t.manualStatus?'selected':''}>${esc(labels[s])}</option>`).join('')}</select><p class="muted">Ручний статус має пріоритет над оцінкою Rovo.</p><label for="note">Мої нотатки</label><textarea id="note" maxlength="20000">${esc(t.note)}</textarea><div class="actions"><button class="primary" id="save">Зберегти</button><button id="done">Завершити → Далі</button></div><div id="saved" role="status">${t.modifiedAt?'Останнє збереження: '+esc(new Date(t.modifiedAt).toLocaleString()):''}</div><details><summary>Текст для копіювання / чернетка листа</summary><p class="muted">Переглянь і відредагуй перед використанням. Лист відкриється в поштовій програмі для перевірки.</p><label for="output">Текст</label><textarea id="output">${esc(t.readyOutput||t.nextAction||'')}</textarea><div class="actions"><button id="copyOutput">Скопіювати цей текст</button><button id="email">Відкрити чернетку листа</button></div></details></section></div>`;
$('manual').onchange=$('note').oninput=()=>{dirty=true;$('saved').textContent='Є незбережені зміни'};
if(drafts[t.key]!==undefined)$('output').value=drafts[t.key];
$('output').oninput=()=>{drafts[t.key]=$('output').value};
$('save').onclick=()=>save(false);$('done').onclick=()=>save(true);
$('copyNext').onclick=()=>copy(t.nextAction||'');$('copyOutput').onclick=()=>copy($('output').value);
$('email').onclick=()=>{location.href='mailto:?subject='+encodeURIComponent(t.key+' — '+t.summary)+'&body='+encodeURIComponent($('output').value)};
}
async function copy(text){try{await navigator.clipboard.writeText(text);message('Скопійовано: '+text.slice(0,130))}catch{message('Копіювання недоступне. Виділи й скопіюй видимий текст вручну.',true)}}
async function save(done){if(busy)return;busy=true;$('save').disabled=$('done').disabled=true;const t=tasks.find(t=>t.key===selected);try{const data={manualStatus:done?'DONE':$('manual').value,note:$('note').value};await api('/api/tasks/'+encodeURIComponent(t.key),data);Object.assign(t,data);t.modifiedAt=new Date().toISOString();dirty=false;if(done){selected=visible().find(x=>x.key!==t.key)?.key||null}renderList();renderDetail();message('Збережено в локальній базі.')}catch(e){message(e.message,true)}finally{busy=false;if($('save'))$('save').disabled=$('done').disabled=false}}
async function load(){try{const d=await api('/api/tasks');latest=d.latest;if(dirty||busy)return;const nextSignature=JSON.stringify(d);if(nextSignature===signature)return;signature=nextSignature;tasks=d.tasks;if(!selected)selected=visible()[0]?.key||null;renderList();renderDetail();message(d.error||(latest?'Snapshot: '+new Date(latest.generated_at).toLocaleString()+' · '+latest.count+' задач · ручні зміни зберігаються':'Очікую перший snapshot у папці inbox.'),!!d.error)}catch(e){message('Сервер недоступний. Запусти Start CCON BA.bat. '+e.message,true)}}
$('import').onclick=async()=>{try{const d=await api('/api/import',{});await load();message(d.message)}catch(e){message(e.message,true)}};
$('export').onclick=async()=>{try{const d=await api('/api/export'),a=document.createElement('a');const u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.href=u;a.download='CCON_BA_State.json';a.click();URL.revokeObjectURL(u)}catch(e){message(e.message,true)}};
function filter(){if(dirty)return;renderList();selected=visible()[0]?.key||null;renderList();renderDetail()}
$('search').oninput=$('filter').onchange=filter;window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});load();setInterval(()=>{if(!dirty&&!busy&&document.activeElement?.id!=='output')load()},5000);
</script></html>
