<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCON BA Desk</title>
<style>
:root{font-family:Segoe UI,Arial,sans-serif;color:#1f2937;background:#eef2f6;--blue:#215bbb;--line:#d9e1eb;--muted:#6b778c;--soft:#f7f9fc;--danger:#c92a2a;--danger-bg:#ffe8e8;--amber:#9a6700;--amber-bg:#fff4cc;--green:#18794e;--green-bg:#e6f6ed;--purple:#6f42c1;--purple-bg:#f0e9ff}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd5e1;border-radius:8px;padding:9px 13px;background:white;color:#203047}button:hover{background:#edf2f8}button:disabled{opacity:.55;cursor:wait}a{color:var(--blue)}header{display:flex;gap:18px;align-items:center;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}h1{font-size:22px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:12px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{padding:7px 10px;background:var(--soft);border:1px solid var(--line);border-radius:8px;font-size:12px}.tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.primary:hover{background:#174990}.dangerBtn{border-color:#e5a8a8;color:#a11}.layout{display:grid;grid-template-columns:minmax(280px,24%) minmax(0,1fr);gap:14px;padding:14px 20px;height:calc(100dvh - 72px)}aside,main{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:0;overflow:auto}.leftTop{position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid #e7ecf2}.tabs{display:flex;gap:4px;padding:10px 10px 6px;overflow:auto}.tab{padding:7px 9px;border:none;background:transparent;color:#536176;font-size:12px;white-space:nowrap}.tab.active{background:#eaf1fc;color:#174990;font-weight:700}.filters{padding:8px 10px 10px;display:grid;grid-template-columns:1fr auto;gap:8px}input,select,textarea{width:100%;padding:9px 10px;border:1px solid #bcc9da;border-radius:7px;background:#fff;color:#1f2937}.count{padding:0 12px 8px;color:var(--muted);font-size:12px}.row{display:block;width:100%;text-align:left;border:0;border-radius:0;background:#fff;padding:13px 14px;border-bottom:1px solid #edf0f4}.row:hover{background:#f8fafc}.row.selected{background:#edf4ff;border-left:4px solid var(--blue);padding-left:10px}.rowTitle{display:block;font-weight:650;margin:5px 0 7px;line-height:1.25}.muted{font-size:12px;color:var(--muted)}.badges{display:flex;gap:5px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;font-size:11px;background:#eef2f7;color:#495b70;padding:3px 7px;border-radius:5px}.badge.blocking{background:var(--danger-bg);color:var(--danger);font-weight:750}.badge.changed{background:var(--amber-bg);color:var(--amber);font-weight:700}.badge.done{background:var(--green-bg);color:var(--green)}.badge.research{background:var(--purple-bg);color:var(--purple)}main{padding:18px 22px}.taskHead{display:flex;align-items:flex-start;justify-content:space-between;gap:18px}.taskHead h2{font-size:25px;line-height:1.2;margin:5px 0 10px}.taskKey{font-size:13px;color:var(--muted)}.topActions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.workspace{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(330px,.85fr);gap:18px;margin-top:12px}.card{border:1px solid var(--line);border-radius:10px;padding:15px 17px;background:#fff;margin-bottom:12px}.card.soft{background:#fafbfd}.sectionTitle{font-size:11px;font-weight:800;letter-spacing:.06em;color:#627187;margin-bottom:7px}.hero{font-size:18px;line-height:1.45;font-weight:650}.text{white-space:pre-wrap;line-height:1.52;margin:0;overflow-wrap:anywhere}.latest{display:flex;gap:10px;align-items:flex-start}.latestDate{font-size:12px;background:#eef2f7;border-radius:6px;padding:4px 7px;white-space:nowrap}.nextCard{border-left:4px solid var(--blue)}.why{color:#536176;margin-top:8px}.steps{margin:8px 0 0;padding-left:22px}.steps li{margin:6px 0;line-height:1.4}.branches{display:grid;gap:7px;margin-top:8px}.branch{padding:9px 10px;background:#f7f9fc;border-radius:7px;border:1px solid #e4e9f0}.doneWhen{padding:10px 12px;background:var(--green-bg);border-radius:8px;color:#285943}.sideSticky{position:sticky;top:0;align-self:start}.fieldLabel{display:block;font-size:12px;font-weight:700;color:#536176;margin:10px 0 6px}.saveState{font-size:12px;color:var(--green);min-height:18px;margin-top:7px}.preparedHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.preparedType{font-weight:800;font-size:12px}.output{min-height:180px;font-family:Segoe UI,Arial,sans-serif;line-height:1.45}.actionRow{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.contactBox{padding:10px 12px;background:#f7f9fc;border-radius:8px;font-size:13px;line-height:1.45}.analysis details{border-top:1px solid #e7ebf0;padding-top:12px}.analysis summary{cursor:pointer;font-weight:700;color:#3d5878}.analysisGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}.mini{background:#f8fafc;border:1px solid #e5eaf0;border-radius:8px;padding:10px}.mini h4{font-size:11px;margin:0 0 7px;color:#607086}.mini ul{margin:0;padding-left:18px}.mini li{margin:5px 0;font-size:13px}.empty{padding:30px;color:#68758b;line-height:1.7}.reviewBanner{background:#fff4cc;border:1px solid #efd87d;color:#725400;padding:11px 13px;border-radius:8px;margin:10px 0}.message{padding:8px 20px;font-size:12px;background:#e9f1fc;border-bottom:1px solid #dbe5f2}.message.error{background:#ffeded;color:#a02929}.hidden{display:none!important}@media(max-width:1050px){.workspace{grid-template-columns:1fr}.sideSticky{position:static}.layout{grid-template-columns:310px 1fr}.analysisGrid{grid-template-columns:1fr}}@media(max-width:760px){header{position:static;flex-wrap:wrap}.tools{margin-left:0}.layout{display:block;height:auto;padding:10px}.leftTop{position:static}aside{max-height:420px;margin-bottom:10px}main{padding:15px}.taskHead{display:block}.topActions{justify-content:flex-start}.workspace{display:block}}
</style>
</head>
<body>
<header>
  <div><h1>CCON BA Desk</h1><p>Jira read-only · твій local workflow зберігається в SQLite</p></div>
  <div class="stats" id="stats"></div>
  <div class="tools"><button id="import">Import snapshot</button><button id="export">Export state</button></div>
</header>
<div id="message" class="message" role="status" aria-live="polite">Завантаження…</div>
<div class="layout">
  <aside>
    <div class="leftTop">
      <div class="tabs" id="tabs"></div>
      <div class="filters"><input id="search" placeholder="Search CCON / summary…"><select id="priorityFilter"><option value="">All priorities</option><option value="P1 DO NOW">P1</option><option value="P2 ACTIONABLE">P2</option><option value="P3 PLAN">P3</option><option value="P4 WAITING">P4</option><option value="P5 CLOSE CANDIDATE">P5</option></select></div>
      <div class="count" id="count"></div>
    </div>
    <div id="list"></div>
  </aside>
  <main id="detail"></main>
</div>
<script>
'use strict';
let tasks=[], selected=null, latest=null, dirty=false, busy=false, signature='', activeTab='today', saveTimer=null;
const drafts={};
const $=id=>document.getElementById(id);
const localStatuses=['AUTO','TODO','IN PROGRESS','WAITING','PARKED','DONE'];
const waitingOptions=['','SUPPLIER','REPORTER','PO','INTERNAL','DEPENDENCY','OTHER'];
const labels={'AUTO':'Follow Rovo','TODO':'To do','IN PROGRESS':'In progress','WAITING':'Waiting','PARKED':'Parked','DONE':'Done','ACTIONABLE NOW':'Actionable now','WAITING INPUT':'Waiting input','WAITING DEPENDENCY':'Waiting dependency','NEEDS DECISION':'Needs decision','NO FURTHER BA ACTION':'No further BA action'};
const tabs=[['today','TODAY'],['changed','CHANGED'],['waiting','WAITING'],['backlog','BACKLOG'],['done','DONE'],['all','ALL']];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
const priority=t=>t.aiPriority||t.priority||t.jiraPriority||'';
const rank=t=>Number.isInteger(t.focusRank)?t.focusRank:9999;
const aiWaiting=t=>['WAITING INPUT','WAITING DEPENDENCY'].includes(t.aiStatus);
const effective=t=>t.manualStatus==='AUTO'?(aiWaiting(t)?'WAITING':t.aiStatus==='NO FURTHER BA ACTION'?'PARKED':'TODO'):t.manualStatus;
const changed=t=>t.reviewAgain||['NEW','CHANGED'].includes(t.changedSinceLastReview);
const isToday=t=>t.active&&rank(t)<=15&&effective(t)!=='DONE'&&effective(t)!=='PARKED'&&effective(t)!=='WAITING';
function message(s,error=false){$('message').textContent=s;$('message').classList.toggle('error',error)}
async function api(path,data){const r=await fetch(path,data===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await r.json();if(!r.ok)throw Error(d.error||'Помилка');return d}
function tabCount(name){return tasks.filter(t=>matchesTab(t,name)).length}
function matchesTab(t,name){if(name==='today')return isToday(t);if(name==='changed')return t.active&&changed(t);if(name==='waiting')return t.active&&effective(t)==='WAITING';if(name==='backlog')return t.active&&!isToday(t)&&effective(t)!=='WAITING'&&effective(t)!=='DONE'&&!t.reviewAgain;if(name==='done')return effective(t)==='DONE';return true}
function renderTabs(){$('tabs').innerHTML=tabs.map(([k,l])=>`<button class="tab ${activeTab===k?'active':''}" data-tab="${k}">${l} ${tabCount(k)}</button>`).join('');$('tabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(dirty&&!confirm('Є незбережені зміни. Перейти без збереження?'))return;activeTab=b.dataset.tab;dirty=false;renderAll(true)})}
function visible(){const q=$('search').value.trim().toLowerCase(),pf=$('priorityFilter').value;return tasks.filter(t=>matchesTab(t,activeTab)&&(pf===''||priority(t)===pf)&&(!q||(t.key+' '+t.summary+' '+(t.taskBrief||'')).toLowerCase().includes(q))).sort((a,b)=>rank(a)-rank(b)||String(priority(a)).localeCompare(String(priority(b)))||a.key.localeCompare(b.key))}
function badge(text,cls=''){return text?`<span class="badge ${cls}">${esc(text)}</span>`:''}
function renderStats(){const today=tasks.filter(isToday).length,chg=tasks.filter(t=>t.active&&changed(t)).length,wait=tasks.filter(t=>t.active&&effective(t)==='WAITING').length,done=tasks.filter(t=>effective(t)==='DONE').length;$('stats').innerHTML=`<span class="stat"><b>${today}</b> Today</span><span class="stat"><b>${chg}</b> Changed</span><span class="stat"><b>${wait}</b> Waiting</span><span class="stat"><b>${done}</b> Done</span>`}
function renderList(){const items=visible();$('count').textContent=items.length+' tasks';$('list').innerHTML=items.map(t=>`<button class="row ${t.key===selected?'selected':''}" data-key="${esc(t.key)}"><span class="muted">${esc(t.key)}${rank(t)<=15?' · #'+rank(t):''}</span><span class="rowTitle">${esc(t.summary)}</span><span class="badges">${badge(priority(t))}${t.blocking?badge('BLOCKING','blocking'):''}${changed(t)?badge(t.reviewAgain?'REVIEW AGAIN':'CHANGED','changed'):''}${effective(t)==='DONE'?badge('DONE','done'):''}${t.actionType==='DEEP_ANALYSIS'?badge('RESEARCH','research'):''}</span></button>`).join('')||'<div class="empty">No tasks in this view.</div>';$('list').querySelectorAll('[data-key]').forEach(el=>el.onclick=()=>{if(dirty&&!confirm('Є незбережені зміни. Перейти без збереження?'))return;selected=el.dataset.key;dirty=false;renderList();renderDetail()})}
function safeUrl(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}}
function latestBlock(t){const l=t.latestChange||{};if(!l.text)return '<p class="text muted">No meaningful latest change provided.</p>';return `<div class="latest"><span class="latestDate">${esc(l.date||'UNKNOWN')}</span><p class="text"><b>${esc(l.source||'')}</b>${l.source?' · ':''}${esc(l.text)}</p></div>`}
function listHtml(items,numbered=false){const a=arr(items);if(!a.length)return '<p class="text muted">None.</p>';return numbered?`<ol class="steps">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:`<ul class="steps">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
function parseEmail(t,text){let subject=t.readyOutputSubject||'';let body=text||'';const m=body.match(/^Subject:\s*(.+)\r?\n+/i);if(m){subject=m[1].trim();body=body.slice(m[0].length)}if(!subject)subject=t.readyOutputTitle||(`${t.key} - ${t.summary}`);return{subject,body}}
function actionLabel(type){return({EMAIL:'Supplier email',JIRA_COMMENT:'Jira comment',TODO:'Implementation To Do',DECISION_REQUEST:'Decision request',ANALYSIS_PROMPT:'Analysis prompt',NONE:'Prepared action'})[type]||type||'Prepared action'}
function renderDetail(){const t=tasks.find(x=>x.key===selected);if(!t){$('detail').innerHTML='<div class="empty"><h2>CCON BA Desk</h2>Select a task on the left. If this is the first run, put <b>CCON_BA_Snapshot.json</b> into <b>inbox</b>.</div>';return}
const url=safeUrl(t.url),pr=priority(t),out=t.readyOutput||'',type=t.readyOutputType||'NONE',contact=t.contactNeeded||['EMAIL','JIRA_COMMENT','DECISION'].includes(t.actionType);
const review=t.reviewAgain?`<div class="reviewBanner"><b>REVIEW AGAIN</b><br>${esc(t.changeSummary||'The task changed after you marked it Done. Review the new context before keeping it closed.')}</div>`:'';
$('detail').innerHTML=`
<div class="taskHead"><div><div class="taskKey">${esc(t.key)}${url?` · <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open Jira ↗</a>`:''}</div><h2>${esc(t.summary)}</h2><div class="badges">${badge(pr)}${t.blocking?badge('BLOCKING','blocking'):''}${changed(t)?badge(t.reviewAgain?'REVIEW AGAIN':'CHANGED','changed'):''}${badge(t.actionType||'')}${t.confidence?badge('Confidence '+t.confidence):''}</div></div><div class="topActions">${t.reviewAgain&&effective(t)==='DONE'?'<button id="keepDone">Keep DONE</button><button class="primary" id="reopen">Reopen → TODO</button>':'<button id="start">Start</button><button id="wait">Waiting</button><button id="park">Park</button><button class="primary" id="done">Done</button><button id="next">Next</button>'}</div></div>
${review}
<div class="workspace">
  <div>
    <div class="card soft"><div class="sectionTitle">WHAT'S GOING ON</div><p class="text hero">${esc(t.taskBrief||t.currentSituation||'Rovo did not provide a concise brief.')}</p></div>
    <div class="card"><div class="sectionTitle">CURRENT SITUATION</div><p class="text">${esc(t.currentSituation||'Not provided.')}</p></div>
    <div class="card"><div class="sectionTitle">LATEST CHANGE</div>${latestBlock(t)}</div>
    <div class="card nextCard"><div class="sectionTitle">MY NEXT STEP</div><p class="text hero" id="nextText">${esc(t.nextAction||'No next action provided.')}</p>${t.whyNextAction?`<p class="text why"><b>WHY:</b> ${esc(t.whyNextAction)}</p>`:''}</div>
    <div class="card"><div class="sectionTitle">DO THIS</div>${listHtml(t.actionPlan,true)}</div>
    <div class="card"><div class="sectionTitle">THEN</div><div class="branches">${arr(t.afterNextAction).length?arr(t.afterNextAction).map(x=>`<div class="branch">${esc(x)}</div>`).join(''):'<span class="muted">No branch logic provided.</span>'}</div></div>
    <div class="card"><div class="sectionTitle">DONE WHEN</div><div class="doneWhen">${esc(t.definitionOfDone||'No definition of done provided.')}</div></div>
    <div class="card analysis"><details><summary>Analysis & Evidence</summary><div style="margin-top:12px"><div class="sectionTitle">SURFACE ANALYSIS</div><p class="text">${esc(t.surfaceAnalysis||'Not provided.')}</p></div><div class="analysisGrid"><div class="mini"><h4>FACTS</h4>${listHtml(t.facts)}</div><div class="mini"><h4>HYPOTHESES</h4>${listHtml(t.hypotheses)}</div><div class="mini"><h4>UNKNOWNS</h4>${listHtml(t.unknowns)}</div></div>${t.blocking?`<div style="margin-top:12px"><div class="sectionTitle">BLOCKING REASON</div><p class="text">${esc(t.blockingReason||'Blocking flag set without explanation.')}</p></div>`:''}${t.waitingEvidence?`<div style="margin-top:12px"><div class="sectionTitle">WAITING EVIDENCE</div><p class="text">${esc(t.waitingEvidence)}</p></div>`:''}</details></div>
  </div>
  <div class="sideSticky">
    <div class="card"><div class="sectionTitle">MY WORKSPACE</div><label class="fieldLabel" for="manual">My status</label><select id="manual">${localStatuses.map(s=>`<option value="${s}" ${s===t.manualStatus?'selected':''}>${esc(labels[s])}</option>`).join('')}</select><div id="waitingWrap" class="${t.manualStatus==='WAITING'?'':'hidden'}"><label class="fieldLabel" for="manualWaiting">Waiting on</label><select id="manualWaiting">${waitingOptions.map(s=>`<option value="${s}" ${s===t.manualWaitingOn?'selected':''}>${esc(s||'Select…')}</option>`).join('')}</select></div><label class="fieldLabel" for="note">My note</label><textarea id="note" maxlength="20000" placeholder="What do I want to remember next time?">${esc(t.note||'')}</textarea><div id="saved" class="saveState">${t.modifiedAt?'Saved '+esc(new Date(t.modifiedAt).toLocaleString()):'Auto-save enabled'}</div></div>
    ${contact?`<div class="card"><div class="sectionTitle">WHO / WHY</div><div class="contactBox"><b>${esc(t.contactTarget||t.contactType||'Contact needed')}</b><br>${esc(t.contactPurpose||'')}</div></div>`:''}
    <div class="card"><div class="preparedHead"><div><div class="sectionTitle">PREPARED ACTION</div><div class="preparedType">${esc(t.readyOutputTitle||actionLabel(type))}</div></div>${badge(actionLabel(type))}</div>${type==='NONE'&&!out?'<p class="muted">No prepared output needed for this task.</p>':`<label class="fieldLabel" for="output">Preview / edit before use</label><textarea id="output" class="output">${esc(out)}</textarea><div class="actionRow">${type==='EMAIL'?'<button class="primary" id="openEmail">Open in Outlook/mail</button>':''}${type==='JIRA_COMMENT'&&url?'<button id="openJiraAction">Open Jira</button>':''}<button id="copyOutput">Copy prepared action</button></div>`}</div>
  </div>
</div>`;
wireTask(t,url,type);
}
function wireTask(t,url,type){if($('manual')){$('manual').onchange=()=>{t.manualStatus=$('manual').value;$('waitingWrap').classList.toggle('hidden',t.manualStatus!=='WAITING');dirty=true;scheduleSave(t)};$('manualWaiting').onchange=()=>{t.manualWaitingOn=$('manualWaiting').value;dirty=true;scheduleSave(t)};$('note').oninput=()=>{t.note=$('note').value;dirty=true;scheduleSave(t)}}if($('output')){if(drafts[t.key]!==undefined)$('output').value=drafts[t.key];$('output').oninput=()=>drafts[t.key]=$('output').value;$('copyOutput').onclick=()=>copy($('output').value);if($('openEmail'))$('openEmail').onclick=()=>{const p=parseEmail(t,$('output').value);location.href='mailto:?subject='+encodeURIComponent(p.subject)+'&body='+encodeURIComponent(p.body)};if($('openJiraAction'))$('openJiraAction').onclick=()=>window.open(url,'_blank','noopener')}
if($('start'))$('start').onclick=()=>quickStatus(t,'IN PROGRESS');if($('wait'))$('wait').onclick=()=>quickStatus(t,'WAITING');if($('park'))$('park').onclick=()=>quickStatus(t,'PARKED');if($('done'))$('done').onclick=()=>quickStatus(t,'DONE',true);if($('next'))$('next').onclick=()=>goNext(t.key);if($('keepDone'))$('keepDone').onclick=()=>clearReview(t,true);if($('reopen'))$('reopen').onclick=()=>clearReview(t,false)}
function scheduleSave(t){clearTimeout(saveTimer);$('saved').textContent='Saving…';saveTimer=setTimeout(()=>saveTask(t),550)}
async function saveTask(t,extra={}){if(busy)return;busy=true;try{const data={manualStatus:t.manualStatus,note:t.note||'',manualWaitingOn:t.manualStatus==='WAITING'?(t.manualWaitingOn||''):'' ,...extra};await api('/api/tasks/'+encodeURIComponent(t.key),data);if(extra.clearReviewAgain)t.reviewAgain=false;t.modifiedAt=new Date().toISOString();dirty=false;if($('saved'))$('saved').textContent='Saved automatically ✓';renderStats();renderTabs();renderList()}catch(e){message(e.message,true);if($('saved'))$('saved').textContent='Save failed'}finally{busy=false}}
async function quickStatus(t,status,next=false){clearTimeout(saveTimer);t.manualStatus=status;if(status!=='WAITING')t.manualWaitingOn='';dirty=true;await saveTask(t);renderDetail();if(next)goNext(t.key)}
async function clearReview(t,keepDone){t.manualStatus=keepDone?'DONE':'TODO';t.reviewAgain=false;dirty=true;await saveTask(t,{clearReviewAgain:true});renderAll(true)}
function goNext(key){const items=visible();const i=items.findIndex(x=>x.key===key);const next=items[i+1]||items[0];if(next&&next.key!==key){selected=next.key;renderList();renderDetail()}}
async function copy(text){try{await navigator.clipboard.writeText(text);message('Copied: '+text.slice(0,120))}catch{message('Clipboard unavailable. Copy the visible text manually.',true)}}
function renderAll(resetSelection=false){renderStats();renderTabs();const items=visible();if(resetSelection||!items.some(t=>t.key===selected))selected=items[0]?.key||null;renderList();renderDetail()}
async function load(){try{const d=await api('/api/tasks');if(dirty||busy)return;const nextSignature=JSON.stringify(d);if(nextSignature===signature)return;signature=nextSignature;tasks=d.tasks;latest=d.latest;renderAll(!selected);message(d.error||(latest?'Snapshot '+new Date(latest.generated_at).toLocaleString()+' · '+latest.count+' tasks · local state preserved':'Waiting for CCON_BA_Snapshot.json in inbox.'),!!d.error)}catch(e){message('Server unavailable. Run Start CCON BA.bat. '+e.message,true)}}
$('import').onclick=async()=>{try{const d=await api('/api/import',{});signature='';await load();message(d.message)}catch(e){message(e.message,true)}};
$('export').onclick=async()=>{try{const d=await api('/api/export'),a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.href=u;a.download='CCON_BA_State.json';a.click();URL.revokeObjectURL(u)}catch(e){message(e.message,true)}};
$('search').oninput=$('priorityFilter').onchange=()=>renderAll(true);
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
load();setInterval(()=>{if(!dirty&&!busy&&document.activeElement?.id!=='output')load()},5000);
</script>
</body>
</html>
