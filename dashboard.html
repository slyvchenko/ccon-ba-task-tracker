<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CCON BA Desk</title>
  <link rel="stylesheet" href="/assets/dashboard.css">
</head>
<body>
  <header>
    <div><h1>CCON BA Desk</h1><p class="muted">Черга дій, аналіз задач і видимі чернетки листів</p></div>
    <div class="tools"><button id="bulkEmail">Відкрити всі листи (0)</button><details id="dataMenu" class="data-menu"><summary>Дані <span aria-hidden="true">▾</span></summary><div class="data-menu-items"><button id="import">Імпортувати snapshot</button><button id="export">Експорт мого стану</button></div></details></div>
  </header>
  <div id="statusbar" class="statusbar" role="status" aria-live="polite"><span id="message"></span><span id="snapshotInfo"></span></div>
  <div class="layout">
    <aside aria-label="Черга задач">
      <div class="filters">
        <input id="search" type="search" aria-label="Пошук задач" placeholder="Ключ, назва або наступна дія…">
        <div class="filter-row">
          <select id="filter" aria-label="Список задач"><option value="open">Поточні незавершені</option><option value="all">Усі поточні</option><option value="done">Завершені</option><option value="archive">Відсутні у snapshot</option></select>
          <select id="signalFilter" aria-label="Тип дії"><option value="all">Усі типи дій</option><option value="READY">Можна працювати</option><option value="WRITE">Написати листа</option><option value="DECIDE">Потрібне рішення</option><option value="REVIEW">Проаналізувати</option><option value="WAIT">Очікуємо</option></select>
        </div>
        <span id="count" class="muted"></span>
      </div>
      <div id="list"></div>
    </aside>
    <main id="detail" aria-label="Обрана задача"></main>
  </div>
  <dialog id="bulkDialog" aria-labelledby="bulkTitle">
    <h3 id="bulkTitle">Чернетки для Outlook</h3>
    <p class="muted">Усі поточні задачі «Написати листа», незалежно від фільтрів. Кожен лист відкриється окремо у стандартній поштовій програмі Windows. Перевір листи й прикріпи логи перед відправленням.</p>
    <div id="bulkList"></div><p id="bulkResult" role="status" class="muted"></p>
    <div class="actions"><button id="bulkOpen" class="primary">Відкрити чернетки</button><button id="bulkClose">Закрити</button></div>
  </dialog>
  <script type="module" src="/assets/dashboard.mjs"></script>
</body>
</html>
